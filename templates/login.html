{% extends "auth_layout.html" %}
{% block title %}ورود{% endblock %}
{% block auth_content %}
<h2>ورود به حساب</h2>
<p class="subtext">نام کاربری و رمز عبور خود را وارد کنید.</p>
<form method="post" class="stack">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% include "account_fields.html" %}
    <button class="button primary full" type="submit">ورود</button>
</form>
<p class="auth-switch">حساب ندارید؟ <a href="{% url 'signup' %}">ثبت‌نام</a></p>
{% endblock %}
