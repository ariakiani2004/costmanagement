{% extends "base.html" %}
{% block title %}تغییر رمز عبور{% endblock %}
{% block content %}
<section class="panel form-panel">
    <h1>تغییر رمز عبور</h1>
    <form method="post" class="stack">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}{% include "field.html" %}{% endfor %}
        <div class="form-actions">
            <button class="button primary" type="submit">ذخیره رمز عبور</button>
            <a class="button secondary" href="{% url 'dashboard' %}">انصراف</a>
        </div>
    </form>
</section>
{% endblock %}
